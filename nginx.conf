# ==============================================================================
# HearMe AI - Production Nginx Reverse Proxy & Load Balancer Configuration
# Implements TRACEN Topics 3 (Load Balancing), 4 (Reverse Proxy), 5 (API Gateway)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging with Correlation IDs
    log_format enterprise '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log enterprise;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Topic 1: Edge Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=ai_strict_limit:10m rate=3r/s;

    # Topic 3: Upstream Cluster for Load Balancing
    upstream hearme_backend_cluster {
        least_conn; # Route to server with fewest active connections
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name hearme.ai www.hearme.ai;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name hearme.ai www.hearme.ai;

        # SSL Certificates
        ssl_certificate     /etc/ssl/certs/hearme_bundle.crt;
        ssl_certificate_key /etc/ssl/private/hearme.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Enterprise Security Headers (Topic 4: Reverse Proxy Hardening)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Serve Compiled Frontend Single Page App
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Static asset aggressive caching
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }

        # Topic 5: API Gateway Proxy Routing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hearme_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (Topic 11)
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Stricter Rate Limiting on Generative AI Endpoints
        location /api/gemini/ {
            limit_req zone=ai_strict_limit burst=5 nodelay;

            proxy_pass http://hearme_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 35s;
            proxy_read_timeout 35s;
        }
    }
}
